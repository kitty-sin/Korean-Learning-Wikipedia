<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>韓語圖解日常動詞百科 · Korean Visual Verb Encyclopedia</title>
  <meta name="description" content="韓語日常動詞圖解百科：涵蓋12大動作生活領域、韓文原形、日常해요體變形、實用生活搭配句、清晰動作圖示與真人發音點讀。">
  <!-- 引入樣式表 -->
  <link rel="stylesheet" href="css/encyclopedia.css">
</head>
<body>

  <!-- 頂部常駐導航列 -->
  <header class="app-header">
    <div class="brand-area">
      <span class="brand-badge" style="background:linear-gradient(135deg, #FFF3E0, #FFE0B2);color:#E65100;">Verb Encyclopedia</span>
      <div class="brand-title">⚡ 韓語日常動詞圖解百科</div>
    </div>
    <div class="header-controls">
      <button class="btn-toc" id="btn-toc">
        <span>📑</span>
        <span>動詞目錄</span>
      </button>
    </div>
  </header>

  <!-- 名詞 / 動詞雙圖鑑模式切換列 -->
  <div class="mode-switcher-container">
    <div class="mode-switch-pill" role="tablist" aria-label="圖鑑類別切換">
      <button class="mode-tab-btn" id="tab-noun" onclick="app.setMode('noun')" role="tab" aria-selected="false">
        <span>🌸</span>
        <span>生活名詞圖鑑 (Noun · 29頁)</span>
      </button>
      <button class="mode-tab-btn active" id="tab-verb" onclick="app.setMode('verb')" role="tab" aria-selected="true">
        <span>⚡</span>
        <span>日常動詞圖鑑 (Verb · 12領域)</span>
      </button>
    </div>
  </div>

  <!-- 領域水平滑動標籤列 -->
  <nav class="domain-bar-container" aria-label="領域分類導航">
    <div class="domain-bar" id="domain-bar">
      <!-- JS 動態生成領域快捷標籤 -->
    </div>
  </nav>

  <!-- 主閱讀器畫布 -->
  <main class="encyclopedia-container">
    <!-- 頂部進度條 -->
    <div class="page-progress-bar">
      <div class="page-stepper" id="page-stepper">
        <!-- JS 動態生成 Dot 點點 -->
      </div>
      <div class="page-counter" id="page-counter">動詞篇 01 / 12</div>
    </div>

    <!-- 雜誌書籍主頁面 -->
    <article class="book-page-canvas" id="page-canvas">
      <!-- JS 動態渲染本頁主題內容 -->
    </article>
  </main>

  <!-- 底部常駐換頁控制列 -->
  <nav class="bottom-nav-bar" aria-label="翻頁導航">
    <button class="nav-btn" id="btn-prev" disabled>
      <span>←</span>
      <span>上一頁</span>
    </button>
    <div class="nav-page-info" id="nav-page-info">動詞篇 Page 01 / 12</div>
    <button class="nav-btn" id="btn-next">
      <span>下一頁</span>
      <span>→</span>
    </button>
  </nav>

  <!-- 百科全域目錄彈窗 (Table of Contents Modal) -->
  <div class="modal-backdrop" id="toc-modal" role="dialog" aria-modal="true">
    <div class="toc-modal">
      <div class="toc-header">
        <div class="toc-title">⚡ 動詞篇主題目錄</div>
        <button class="btn-close-modal" id="btn-close-modal" aria-label="關閉目錄">✕</button>
      </div>
      <div class="toc-list" id="toc-list">
        <!-- JS 動態渲染目錄列表 -->
      </div>
    </div>
  </div>

  <!-- 載入資料集與應用核心邏輯 -->
  <script src="js/encyclopedia_data.js"></script>
  <script src="js/verbs_data.js"></script>
  <script src="js/encyclopedia_app.js"></script>
  <script>
    // 預設進入動詞篇模式
    window.addEventListener('DOMContentLoaded', () => {
      if (window.app) {
        window.app.setMode('verb');
      }
    });
  </script>
</body>
</html>
