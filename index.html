<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>韓語圖解生活百科全書 · Korean Visual Encyclopedia</title>
  <meta name="description" content="韓語生活圖解百科全書：每頁聚焦核心生活單字、清晰圖像、道地繁體中文釋義、韓文發音點讀與極致舒適留白排版。">
  <!-- 引入樣式表 -->
  <link rel="stylesheet" href="css/encyclopedia.css">
</head>
<body data-mode="noun">

  <!-- 頂部常駐導航列 -->
  <header class="app-header">
    <div class="brand-area">
      <span class="brand-badge">Korean Illustrated Encyclopedia</span>
      <div class="brand-title">📖 韓語生活圖解百科全書</div>
    </div>
    <div class="header-controls">
      <button class="btn-toc" id="btn-toc">
        <span>📑</span>
        <span>百科目錄</span>
      </button>
    </div>
  </header>

  <!-- 13 大全景韓語圖解模式切換列 (7大品詞 + 4大語法核心 + 2大專題圖鑑) -->
  <div class="mode-switcher-container">
    <div class="mode-switch-pill" role="tablist" aria-label="圖鑑模式分類切換">
      <!-- 📚 核心品詞 (7) -->
      <button class="mode-tab-btn active" data-mode="noun" onclick="app.setMode('noun')" role="tab" aria-selected="true">
        <span>🌸</span>
        <span>名詞 Noun</span>
      </button>
      <button class="mode-tab-btn" data-mode="verb" onclick="app.setMode('verb')" role="tab" aria-selected="false">
        <span>⚡</span>
        <span>動詞 Verb</span>
      </button>
      <button class="mode-tab-btn" data-mode="adjective" onclick="app.setMode('adjective')" role="tab" aria-selected="false">
        <span>🌈</span>
        <span>形容詞 Adjective</span>
      </button>
      <button class="mode-tab-btn" data-mode="adverb" onclick="app.setMode('adverb')" role="tab" aria-selected="false">
        <span>✨</span>
        <span>副詞 Adverb</span>
      </button>
      <button class="mode-tab-btn" data-mode="pronoun" onclick="app.setMode('pronoun')" role="tab" aria-selected="false">
        <span>👤</span>
        <span>代名詞 Pronoun</span>
      </button>
      <button class="mode-tab-btn" data-mode="proper_noun" onclick="app.setMode('proper_noun')" role="tab" aria-selected="false">
        <span>🏛️</span>
        <span>專有名詞 Proper Noun</span>
      </button>
      <button class="mode-tab-btn" data-mode="dependent_noun" onclick="app.setMode('dependent_noun')" role="tab" aria-selected="false">
        <span>📦</span>
        <span>依存名詞 Dependent Noun</span>
      </button>

      <!-- 🧩 語法核心 (4) -->
      <span class="mode-divider" title="語法核心"></span>
      <button class="mode-tab-btn" data-mode="numeral" onclick="app.setMode('numeral')" role="tab" aria-selected="false">
        <span>🔢</span>
        <span>數字雙系統 Numeral</span>
      </button>
      <button class="mode-tab-btn" data-mode="determiner" onclick="app.setMode('determiner')" role="tab" aria-selected="false">
        <span>🔤</span>
        <span>冠形詞 Determiner</span>
      </button>
      <button class="mode-tab-btn" data-mode="particle" onclick="app.setMode('particle')" role="tab" aria-selected="false">
        <span>🧩</span>
        <span>核心助詞 Particle</span>
      </button>
      <button class="mode-tab-btn" data-mode="greeting" onclick="app.setMode('greeting')" role="tab" aria-selected="false">
        <span>💬</span>
        <span>生活問候 Greeting</span>
      </button>

      <!-- 🌟 專題圖鑑 (2) -->
      <span class="mode-divider" title="專題圖鑑"></span>
      <button class="mode-tab-btn" data-mode="loanword" onclick="app.setMode('loanword')" role="tab" aria-selected="false">
        <span>🌍</span>
        <span>外來語借詞 Loanword</span>
      </button>
      <button class="mode-tab-btn" data-mode="sanrio_food" onclick="app.setMode('sanrio_food')" role="tab" aria-selected="false">
        <span>🍲</span>
        <span>三麗鷗美食 Sanrio Food</span>
      </button>
    </div>
  </div>

  <!-- 生活領域水平滑動標籤列 -->
  <nav class="domain-bar-container" aria-label="領域分類導航">
    <div class="domain-bar" id="domain-bar">
      <!-- JS 動態生成領域快捷標籤 -->
    </div>
  </nav>

  <!-- 主閱讀器畫布 -->
  <main class="encyclopedia-container">
    <!-- 頂部進度條 -->
    <div class="page-progress-bar">
      <div class="page-stepper" id="page-stepper">
        <!-- JS 動態生成 Dot 點點 -->
      </div>
      <div class="page-counter" id="page-counter">01 / 05</div>
    </div>

    <!-- 雜誌書籍主頁面 -->
    <article class="book-page-canvas" id="page-canvas">
      <!-- JS 動態渲染本頁主題內容 -->
    </article>
  </main>

  <!-- 底部常駐換頁控制列 -->
  <nav class="bottom-nav-bar" aria-label="翻頁導航">
    <button class="nav-btn" id="btn-prev" disabled>
      <span>←</span>
      <span>上一頁</span>
    </button>
    <div class="nav-page-info" id="nav-page-info">Page 01 / 05</div>
    <button class="nav-btn" id="btn-next">
      <span>下一頁</span>
      <span>→</span>
    </button>
  </nav>

  <!-- 百科全域目錄彈窗 (Table of Contents Modal) -->
  <div class="modal-backdrop" id="toc-modal" role="dialog" aria-modal="true">
    <div class="toc-modal">
      <div class="toc-header">
        <div class="toc-title">📚 圖解百科主題總覽</div>
        <button class="btn-close-modal" id="btn-close-modal" aria-label="關閉目錄">✕</button>
      </div>
      <div class="toc-list" id="toc-list">
        <!-- JS 動態渲染目錄列表 -->
      </div>
    </div>
  </div>

  <!-- 載入資料集與應用核心邏輯 -->
  <script src="js/encyclopedia_data.js"></script>
  <script src="js/verbs_data.js"></script>
  <script src="js/adjectives_data.js"></script>
  <script src="js/adverbs_data.js"></script>
  <script src="js/pronouns_data.js"></script>
  <script src="js/proper_nouns_data.js"></script>
  <script src="js/dependent_nouns_data.js"></script>
  <script src="js/numerals_data.js"></script>
  <script src="js/determiners_data.js"></script>
  <script src="js/particles_data.js"></script>
  <script src="js/greetings_data.js"></script>
  <script src="js/loanwords_data.js"></script>
  <script src="js/sanrio_food_data.js"></script>
  <script src="js/encyclopedia_app.js"></script>
</body>
</html>
