<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>韓語圖解生活百科全書 · Korean Visual Encyclopedia</title>
  <meta name="description" content="韓語生活圖解百科全書：每頁聚焦核心生活單字、清晰圖像、道地繁體中文釋義、韓文發音點讀與極致舒適留白排版。">
  <!-- PWA 與行動裝置配置 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FF85A2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="韓語圖解百科">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="shortcut icon" href="icons/favicon.png">

  <!-- 引入樣式表 (附帶版本快取控制) -->
  <link rel="stylesheet" href="css/encyclopedia.css?v=20260920_v5">

  <!-- 核心搜尋欄與百科目錄膠囊按鈕精緻樣式 (即刻渲染，零延遲與零違和感) -->
  <style id="search-bar-critical-css">
    .btn-toc {
      background: #FFFFFF !important;
      border: 1.8px solid #FFCCD5 !important;
      color: #E11D48 !important;
      font-size: 0.92rem !important;
      font-weight: 800 !important;
      padding: 8px 20px !important;
      border-radius: 9999px !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      box-shadow: 0 3px 10px rgba(225, 29, 72, 0.08) !important;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      letter-spacing: 0.3px !important;
    }
    .btn-toc:hover {
      background: #FFF5F7 !important;
      border-color: #FB7185 !important;
      color: #BE123C !important;
      transform: translateY(-2px) scale(1.03) !important;
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.16) !important;
    }
    .btn-toc:active {
      transform: translateY(0) scale(0.98) !important;
    }
    .toc-title-pill {
      background: #FFFFFF !important;
      border: 1.8px solid #FFCCD5 !important;
      color: #E11D48 !important;
      font-size: 1.05rem !important;
      font-weight: 800 !important;
      padding: 6px 18px !important;
      border-radius: 9999px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      box-shadow: 0 2px 8px rgba(225, 29, 72, 0.08) !important;
      letter-spacing: 0.5px !important;
    }
    .search-section-wrapper {
      position: relative;
      max-width: 880px;
      width: calc(100% - 32px);
      margin: 14px auto 10px auto;
      z-index: 95;
    }
    .search-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      flex-wrap: nowrap;
    }
    .search-input-pill {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: #FFFDF8 !important;
      border: 2px solid #FCD34D !important;
      border-radius: 9999px !important;
      padding: 6px 18px !important;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.12), inset 0 1px 2px #FFFFFF !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .search-input-pill:hover {
      border-color: #F59E0B !important;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.18) !important;
    }
    .search-input-pill:focus-within {
      background: #FFFFFF !important;
      border-color: #D97706 !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.22), 0 6px 22px rgba(245, 158, 11, 0.18) !important;
    }
    .search-icon-lens {
      font-size: 1.15rem;
      margin-right: 10px;
      user-select: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      font-size: 0.96rem !important;
      font-weight: 500 !important;
      color: #2D3748 !important;
      line-height: 1.5 !important;
      font-family: inherit !important;
      padding: 4px 0 !important;
    }
    .search-input::placeholder {
      color: #9CA3AF !important;
      font-size: 0.91rem !important;
      font-weight: 400 !important;
    }
    .btn-search-clear {
      background: #F3F4F6 !important;
      border: none !important;
      border-radius: 50% !important;
      width: 22px !important;
      height: 22px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      color: #6B7280 !important;
      font-size: 0.72rem !important;
      margin-left: 8px !important;
      transition: all 0.2s ease !important;
      flex-shrink: 0;
    }
    .btn-search-clear:hover {
      background: #E5E7EB !important;
      color: #111827 !important;
    }
    .btn-search-submit {
      background: linear-gradient(135deg, #FF7A00 0%, #EA580C 100%) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: 9999px !important;
      padding: 10px 24px !important;
      font-size: 0.96rem !important;
      font-weight: 800 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
      white-space: nowrap !important;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      letter-spacing: 0.5px;
    }
    .btn-search-submit:hover {
      transform: translateY(-2px) scale(1.03) !important;
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.48) !important;
    }
    .btn-search-submit:active {
      transform: translateY(1px) scale(0.97) !important;
    }
    .search-result-card.is-clickable {
      cursor: pointer;
      user-select: none;
    }
    .search-result-card.is-clickable:hover {
      background: #FFF9FA !important;
      border-color: #F472B6 !important;
      transform: translateX(4px) !important;
    }
  </style>
</head>
<body data-mode="noun">

  <!-- 頂部常駐導航列 -->
  <header class="app-header">
    <div class="brand-area">
      <span class="brand-badge">Korean Illustrated Encyclopedia</span>
      <div class="brand-title">📖 韓語生活圖解百科全書</div>
    </div>
    <div class="header-controls">
      <button class="btn-toc" id="btn-toc">
        <span>📑</span>
        <span>百科目錄</span>
      </button>
    </div>
  </header>

  <!-- 全域即時多向搜尋欄 (依使用者設計圖稿) -->
  <section class="search-section-wrapper" id="search-section-wrapper">
    <div class="search-bar-container">
      <div class="search-input-pill">
        <span class="search-icon-lens">🔍</span>
        <input type="text"
               id="search-input"
               class="search-input"
               placeholder="即時搜尋：輸入韓文 (애정)、中文 (愛情)、拼音 (aiqing)、羅馬拼音 (aejeong) 或英文..."
               autocomplete="off"
               spellcheck="false">
        <button type="button" class="btn-search-clear" id="btn-search-clear" title="清空" style="display: none;">✕</button>
      </div>
      <button type="button" class="btn-search-submit" id="btn-search-submit">
        <span>🔍</span>
        <span>搜尋</span>
      </button>
    </div>

    <!-- 懸浮搜尋結果下拉面板 -->
    <div class="search-results-panel" id="search-results-panel" style="display: none;">
      <div class="search-results-header">
        <div class="search-stats">
          <span class="stats-badge" id="search-stats-badge">找到 0 筆結果</span>
        </div>
        <div class="search-filter-pills" id="search-filter-pills">
          <button type="button" class="filter-pill active" data-filter="all">全部 (0)</button>
          <button type="button" class="filter-pill" data-filter="wiki">📖 圖解百科 (0)</button>
          <button type="button" class="filter-pill" data-filter="dict">📚 核心詞庫 (0)</button>
          <button type="button" class="filter-pill" data-filter="hanja">🀄 漢字詞 (0)</button>
        </div>
        <button type="button" class="btn-results-close" id="btn-results-close" title="關閉搜尋結果">✕</button>
      </div>
      <div class="search-results-list" id="search-results-list">
        <!-- JS 動態渲染卡片清單 -->
      </div>
    </div>
  </section>

  <!-- 13 大全景韓語圖解模式切換列 (7大品詞 + 4大語法核心 + 2大專題圖鑑) -->
  <div class="mode-switcher-container">
    <div class="mode-switch-pill" role="tablist" aria-label="圖鑑模式分類切換">
      <!-- 📚 核心品詞 (7) -->
      <button class="mode-tab-btn active" data-mode="noun" onclick="app.setMode('noun', true)" role="tab" aria-selected="true">
        <span>🌸</span>
        <span>名詞 Noun</span>
      </button>
      <button class="mode-tab-btn" data-mode="verb" onclick="app.setMode('verb', true)" role="tab" aria-selected="false">
        <span>⚡</span>
        <span>動詞 Verb</span>
      </button>
      <button class="mode-tab-btn" data-mode="adjective" onclick="app.setMode('adjective', true)" role="tab" aria-selected="false">
        <span>🌈</span>
        <span>形容詞 Adjective</span>
      </button>
      <button class="mode-tab-btn" data-mode="adverb" onclick="app.setMode('adverb', true)" role="tab" aria-selected="false">
        <span>✨</span>
        <span>副詞 Adverb</span>
      </button>
      <button class="mode-tab-btn" data-mode="pronoun" onclick="app.setMode('pronoun', true)" role="tab" aria-selected="false">
        <span>👤</span>
        <span>代名詞 Pronoun</span>
      </button>
      <button class="mode-tab-btn" data-mode="proper_noun" onclick="app.setMode('proper_noun', true)" role="tab" aria-selected="false">
        <span>🏛️</span>
        <span>專有名詞 Proper Noun</span>
      </button>
      <button class="mode-tab-btn" data-mode="dependent_noun" onclick="app.setMode('dependent_noun', true)" role="tab" aria-selected="false">
        <span>📦</span>
        <span>依存名詞 Dependent Noun</span>
      </button>

      <!-- 🧩 語法核心 (4) -->
      <span class="mode-divider" title="語法核心"></span>
      <button class="mode-tab-btn" data-mode="numeral" onclick="app.setMode('numeral', true)" role="tab" aria-selected="false">
        <span>🔢</span>
        <span>數字雙系統 Numeral</span>
      </button>
      <button class="mode-tab-btn" data-mode="determiner" onclick="app.setMode('determiner', true)" role="tab" aria-selected="false">
        <span>🔤</span>
        <span>冠形詞 Determiner</span>
      </button>
      <button class="mode-tab-btn" data-mode="particle" onclick="app.setMode('particle', true)" role="tab" aria-selected="false">
        <span>🧩</span>
        <span>核心助詞 Particle</span>
      </button>
      <button class="mode-tab-btn" data-mode="greeting" onclick="app.setMode('greeting', true)" role="tab" aria-selected="false">
        <span>💬</span>
        <span>生活問候 Greeting</span>
      </button>

      <!-- 🌟 專題圖鑑 (2) -->
      <span class="mode-divider" title="專題圖鑑"></span>
      <button class="mode-tab-btn" data-mode="loanword" onclick="app.setMode('loanword', true)" role="tab" aria-selected="false">
        <span>🌍</span>
        <span>外來語借詞 Loanword</span>
      </button>
      <button class="mode-tab-btn" data-mode="sanrio_food" onclick="app.setMode('sanrio_food', true)" role="tab" aria-selected="false">
        <span>🍲</span>
        <span>三麗鷗美食 Sanrio Food</span>
      </button>
    </div>
  </div>

  <!-- 彈出式副頁生活領域標籤抽屜 (Pop-out Sub-page Domain Drawer) -->
  <div class="domain-popout-wrapper" id="domain-popout-wrapper" aria-label="副頁領域彈出導航">
    <div class="domain-popout-card">
      <div class="domain-popout-header">
        <div class="domain-popout-title" id="domain-popout-title">
          <span>🌸</span>
          <span>副頁領域主題</span>
        </div>
        <button class="domain-popout-close" id="btn-close-domain-popout" onclick="app.closeDomainPopout()" title="收起副頁標籤">✕</button>
      </div>
      <div class="domain-bar" id="domain-bar">
        <!-- JS 動態生成領域快捷彩色標籤 -->
      </div>
    </div>
  </div>

  <!-- 主閱讀器畫布 -->
  <main class="encyclopedia-container">
    <!-- 頂部進度條 -->
    <div class="page-progress-bar">
      <div class="page-stepper" id="page-stepper">
        <!-- JS 動態生成 Dot 點點 -->
      </div>
      <div class="page-counter" id="page-counter">01 / 05</div>
    </div>

    <!-- 雜誌書籍主頁面 -->
    <article class="book-page-canvas" id="page-canvas">
      <!-- JS 動態渲染本頁主題內容 -->
    </article>
  </main>

  <!-- 底部常駐換頁控制列 -->
  <nav class="bottom-nav-bar" aria-label="翻頁導航">
    <button class="nav-btn" id="btn-prev" disabled>
      <span>←</span>
      <span>上一頁</span>
    </button>
    <div class="nav-page-info" id="nav-page-info">Page 01 / 05</div>
    <button class="nav-btn" id="btn-next">
      <span>下一頁</span>
      <span>→</span>
    </button>
  </nav>

  <!-- 百科全域目錄彈窗 (Table of Contents Modal · 01~13 全景導航大綱) -->
  <div class="modal-backdrop" id="toc-modal" role="dialog" aria-modal="true">
    <div class="toc-modal toc-global-modal">
      <div class="toc-header">
        <div class="toc-title-pill">
          <span>📑</span>
          <span>百科目錄</span>
        </div>
        <button class="btn-close-modal" id="btn-close-modal" aria-label="關閉目錄">✕</button>
      </div>
      <div class="toc-list toc-global-list" id="toc-list">
        <!-- JS 動態渲染 01~13 全景導航清單 -->
      </div>
    </div>
  </div>

  <!-- 載入資料集與應用核心邏輯 -->
  <script src="js/encyclopedia_data.js"></script>
  <script src="js/verbs_data.js"></script>
  <script src="js/adjectives_data.js"></script>
  <script src="js/adverbs_data.js"></script>
  <script src="js/pronouns_data.js"></script>
  <script src="js/proper_nouns_data.js"></script>
  <script src="js/dependent_nouns_data.js"></script>
  <script src="js/numerals_data.js"></script>
  <script src="js/determiners_data.js"></script>
  <script src="js/particles_data.js"></script>
  <script src="js/greetings_data.js"></script>
  <script src="js/loanwords_data.js?v=20260920_v6"></script>
  <script src="js/sanrio_food_data.js?v=20260920_v6"></script>
  <script src="js/encyclopedia_app.js?v=20260920_v6"></script>
  <script src="js/search_index.js?v=20260920_v6" defer></script>
  <script src="js/encyclopedia_search.js?v=20260920_v6" defer></script>

  <!-- PWA Service Worker 智慧離線快取註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered successfully:', reg.scope))
          .catch(err => console.error('PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
